<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>球球打地鼠</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#92dfe6">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="球球打地鼠">
<style>
  :root {
    --ink: #7a7050;
    --purple: #e2d4ff;
    --purple-deep: #b9a3e8;
    --cream: #fffaf0;
    --sky: #92dfe6;
    --grass: #e6e46e;
    --pink: #f29a8e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  img { -webkit-user-drag: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; height: 100%;
    background: #6fc6ce;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;  /* 长按图片不弹“存储图像”菜单 */
    /* 不要滚动和缩放：关掉双击放大、双指缩放 */
    touch-action: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  /* 每种语言用对应地区的字体 */
  :lang(zh-TW) { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  :lang(ja) { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif; }
  :lang(ko) { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  :lang(en) { font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
  :lang(zh-CN) { font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif; }

  /* 舞台按背景图 1350x3000 等比缩放，内部坐标用百分比，尺寸用 --u（舞台宽度的 1%）。
     宽高和 --u 由脚本 layout() 按窗口实际大小设置，这里只是脚本运行前的初始值。 */
  .stage {
    --u: 1vw;
    position: relative;
    flex: none;
    width: 100vw; height: 222.2vw;
    background: var(--sky) url("assets/bg.png") center / 100% 100% no-repeat;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 0, 0, .15);
  }
  /* 脚本算好尺寸前不要有过渡动画 */
  .stage:not(.ready) * { transition: none !important; }
  @media (pointer: fine) { .stage { cursor: none; } }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; left: calc(var(--u) * 4); right: calc(var(--u) * 4);
    top: calc(var(--u) * 4 + var(--safe-top, 0px));
    display: flex; justify-content: space-between;
    z-index: 50; pointer-events: none;
  }
  .hud .pill + .pill { margin-left: calc(var(--u) * 3); }
  .pill {
    flex: 1;
    background: var(--cream);
    border: calc(var(--u) * 1.2) solid var(--ink);
    border-radius: calc(var(--u) * 6);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2) calc(var(--u) * 1.2);
    text-align: center;
  }
  .pill small { display: block; font-size: calc(var(--u) * 3.4); font-weight: 700; opacity: .75; }
  .pill b { display: block; font-size: calc(var(--u) * 7.5); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .pill.low b { color: #e0705f; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12); } }

  /* 道具栏：捡到的狐萝卜放这里，点一下拿在手上，再点一下放回 */
  .slot {
    all: unset;
    position: absolute; right: calc(var(--u) * 4); bottom: calc(var(--u) * 4 + var(--slot-lift, 0px));
    width: calc(var(--u) * 19); height: calc(var(--u) * 19);
    background: var(--cream);
    border: calc(var(--u) * 1.2) solid var(--ink);
    border-radius: calc(var(--u) * 5);
    box-shadow: 0 calc(var(--u) * 1.2) 0 var(--ink);
    z-index: 55;
    transition: transform .1s, background .15s, opacity .15s;
  }
  .slot .ico { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; border-radius: calc(var(--u) * 4); }
  .slot .ico img { position: absolute; width: calc(var(--u) * 30); height: calc(var(--u) * 30); left: calc(var(--u) * -6.7); top: calc(var(--u) * -8); }
  .slot .count {
    position: absolute; right: calc(var(--u) * -2.4); top: calc(var(--u) * -2.4);
    min-width: calc(var(--u) * 7); height: calc(var(--u) * 7); padding: 0 calc(var(--u) * 1.4);
    border-radius: 99px;
    background: #ff8f80; color: #fff;
    border: calc(var(--u) * .9) solid var(--ink);
    font-size: calc(var(--u) * 4); font-weight: 900; line-height: calc(var(--u) * 5.2); text-align: center;
  }
  /* empty：一个萝卜都没有（变淡）；none：格子里没有萝卜（拿在手上的不算）*/
  .slot.empty { opacity: .45; }
  .slot.none .ico, .slot.none .count { visibility: hidden; }
  .slot.on { background: var(--purple); transform: translateY(calc(var(--u) * -1.6)); box-shadow: 0 calc(var(--u) * 2.8) 0 var(--ink); }
  /* 萝卜使用中：格子外一圈闪烁的光环（用 ::after，不和 got 弹跳动画抢 animation） */
  .slot::after {
    content: '';
    position: absolute;
    top: calc(var(--u) * -2.6); left: calc(var(--u) * -2.6);
    right: calc(var(--u) * -2.6); bottom: calc(var(--u) * -2.6);
    border: calc(var(--u) * 1.4) solid #ffd84d;
    border-radius: calc(var(--u) * 7);
    box-shadow: 0 0 0 calc(var(--u) * .9) var(--ink), 0 0 calc(var(--u) * 4) calc(var(--u) * 1.6) rgba(255, 244, 170, .95);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .slot.on::after { opacity: 1; animation: glow .9s ease-in-out infinite alternate; }
  @keyframes glow {
    from { opacity: .55; transform: scale(.97); }
    to { opacity: 1; transform: scale(1.04); }
  }
  .slot.got { animation: got .35s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes got { 40% { transform: scale(1.25); } }
  .slot:not(.none) .ico img { transform-origin: 50% 65%; animation: jitter .14s linear infinite; }
  .slot:focus-visible { outline: calc(var(--u) * 1) solid #fff; outline-offset: calc(var(--u) * .6); }

  /* ---------- 洞 ---------- */
  .hole {
    position: absolute;
    width: calc(471 / 1350 * 100%);
    height: calc(471 / 3000 * 100%);
    pointer-events: none;
  }
  .hole img { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block; }
  .hole img:not([src]) { visibility: hidden; }
  /* 只在地洞前沿下边线以上可见 */
  .clip {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    -webkit-clip-path: polygon(0% 0%, 100% 0%, 100% 69%, 84.9% 69.9%, 80.7% 76.9%, 76.4% 79.7%, 72.2% 81.2%,
      63.7% 82.5%, 55.2% 83.1%, 46.7% 83.3%, 38.2% 82.9%, 29.7% 81.4%, 25.5% 80.5%, 21.2% 78.4%,
      17% 74.4%, 14.9% 69%, 0% 69%);
    clip-path: polygon(0% 0%, 100% 0%, 100% 69%, 84.9% 69.9%, 80.7% 76.9%, 76.4% 79.7%, 72.2% 81.2%,
      63.7% 82.5%, 55.2% 83.1%, 46.7% 83.3%, 38.2% 82.9%, 29.7% 81.4%, 25.5% 80.5%, 21.2% 78.4%,
      17% 74.4%, 14.9% 69%, 0% 69%);
  }
  .char {
    transform: translateY(62%);
    transition: transform .18s cubic-bezier(.34, 1.4, .64, 1);
  }
  .hole.up .char { transform: translateY(0); }
  .hole.sink .char { transition: transform .22s ease-in; transform: translateY(62%); }
  /* 狐萝卜的抖动（洞里、道具栏、手上）。
     用独立的 rotate / translate 属性，不影响升降和挥动用的 transform */
  .hole.wiggle .char { transform-origin: 50% 80%; animation: jitter .14s linear infinite; }
  @keyframes jitter {
    0%, 100% { rotate: 0deg; translate: 0 0; }
    25% { rotate: -2.5deg; translate: -.8% .3%; }
    50% { rotate: 1.5deg; translate: .6% -.4%; }
    75% { rotate: -1deg; translate: .8% .2%; }
  }

  .pop {
    position: absolute; left: 50%; top: 22%;
    font-size: calc(var(--u) * 8); font-weight: 900;
    color: #fff;
    -webkit-text-stroke: calc(var(--u) * 1.1) var(--ink); paint-order: stroke fill;
    transform: translateX(-50%);
    animation: floatUp .8s ease-out forwards;
    z-index: 5; white-space: nowrap;
  }
  .pop.plus-big { color: #ffd84d; font-size: calc(var(--u) * 10); }
  .pop.minus { color: #ff8f80; }
  .pop.item-pop { color: var(--purple); font-size: calc(var(--u) * 7); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 20%) scale(.6); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
  }

  /* ---------- 突脸 ---------- */
  .face {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
    z-index: 60; pointer-events: none; display: none;
  }
  .face.show { display: block; }
  .stage.shake { animation: shake .35s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-1.5%, .5%); }
    40% { transform: translate(1.5%, -.5%); }
    60% { transform: translate(-1%, .3%); }
    80% { transform: translate(1%, 0); }
  }

  /* ---------- 手里的武器（锤子 / 狐萝卜）---------- */
  .weapon {
    position: absolute; left: 0; top: 0;
    width: calc(var(--u) * 26); height: calc(var(--u) * 26);
    z-index: 80; pointer-events: none;
    transform-origin: 50% 87%;
    transform: rotate(18deg);
    opacity: 0;
    transition: opacity .15s;
  }
  .weapon.on { opacity: 1; }
  .weapon.swing { animation: swing .16s ease-out; }
  .weapon.jitter { animation: jitter .14s linear infinite; }
  .weapon.jitter.swing { animation: swing .16s ease-out, jitter .14s linear infinite; }
  @keyframes swing {
    0% { transform: rotate(18deg); }
    45% { transform: rotate(-38deg) scale(.95); }
    100% { transform: rotate(18deg); }
  }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 70;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: calc(var(--u) * 26 + var(--safe-top, 0px));
    background: rgba(146, 223, 230, .35);
    cursor: auto;
  }
  .overlay[hidden], .card[hidden] { display: none; }

  /* 语言切换 */
  .langs { display: flex; margin-top: calc(var(--u) * 6); }
  .langs button + button { margin-left: calc(var(--u) * 2); }
  .langs button {
    all: unset;
    min-width: calc(var(--u) * 11); height: calc(var(--u) * 9); padding: 0 calc(var(--u) * 1.6);
    border-radius: 99px;
    background: var(--cream);
    border: calc(var(--u) * 1) solid var(--ink);
    font-size: calc(var(--u) * 4); font-weight: 800; color: var(--ink);
    text-align: center; line-height: calc(var(--u) * 9);
    cursor: pointer;
    opacity: .7;
  }
  .langs button:hover { opacity: 1; }
  .langs button[aria-pressed="true"] { background: var(--purple); opacity: 1; }
  .langs button:focus-visible { outline: calc(var(--u) * 1) solid #fff; outline-offset: calc(var(--u) * .6); }
  .card {
    width: calc(var(--u) * 86);
    background: var(--cream);
    border: calc(var(--u) * 1.4) solid var(--ink);
    border-radius: calc(var(--u) * 8);
    padding: calc(var(--u) * 5) calc(var(--u) * 5) calc(var(--u) * 6.5);
    text-align: center;
    box-shadow: 0 calc(var(--u) * 2.4) 0 rgba(122, 112, 80, .25);
    animation: cardIn .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes cardIn { from { transform: translateX(var(--tx, 0)) scale(.8); opacity: 0; } }
  .card h1, .card h2 { margin: 0 0 calc(var(--u) * 2); font-size: calc(var(--u) * 10); letter-spacing: .05em; white-space: nowrap; }
  /* 标题较长的语言缩小一点，保持一行 */
  :lang(ja) .card h1 { font-size: calc(var(--u) * 8.4); letter-spacing: 0; }
  :lang(ko) .card h1 { font-size: calc(var(--u) * 8); letter-spacing: 0; }
  :lang(en) .card h1, :lang(en) .card h2 { font-size: calc(var(--u) * 8); letter-spacing: 0; }
  .card p { margin: 0 0 calc(var(--u) * 4); font-size: calc(var(--u) * 4.2); line-height: 1.6; }
  .rules { margin: 0 0 calc(var(--u) * 5); }
  .rule + .rule { margin-top: calc(var(--u) * 2); }
  .rule {
    display: flex; align-items: center;
    background: #f3edff; border-radius: calc(var(--u) * 4); padding: calc(var(--u) * .8) calc(var(--u) * 3) calc(var(--u) * .8) calc(var(--u) * .8);
    font-size: calc(var(--u) * 3.9); font-weight: 700; text-align: left; line-height: 1.35;
  }
  .rule .ico { position: relative; width: calc(var(--u) * 14); height: calc(var(--u) * 14); overflow: hidden; flex: none; margin-right: calc(var(--u) * 2.4); }
  .rule .ico img { position: absolute; width: calc(var(--u) * 24); height: calc(var(--u) * 24); left: calc(var(--u) * -5); top: calc(calc(var(--u) * 7) - calc(var(--u) * 24) * var(--cy)); }
  .rule .pts { margin-left: auto; font-size: calc(var(--u) * 4.8); white-space: nowrap; }
  .rule.bad { background: #fff0e8; }
  .rule.bad .pts { color: #e0705f; }
  .rule.feed { background: #fff6dc; }
  .rule .feed-pts { font-size: calc(var(--u) * 4); text-align: right; line-height: 1.3; }
  .result-score { font-size: calc(var(--u) * 18); font-weight: 900; line-height: 1.1; margin: calc(var(--u) * 1) 0 calc(var(--u) * 2); }
  .new-record { color: #e0705f; font-weight: 800; }
  .btn {
    font: inherit; font-size: calc(var(--u) * 6.4); font-weight: 900; color: var(--ink);
    background: var(--purple);
    border: calc(var(--u) * 1.2) solid var(--ink);
    border-radius: 99px;
    padding: calc(var(--u) * 2.2) calc(var(--u) * 12);
    cursor: pointer;
    box-shadow: 0 calc(var(--u) * 1.6) 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { background: #d6c4ff; }
  .btn:active { transform: translateY(calc(var(--u) * 1.2)); box-shadow: 0 calc(var(--u) * .4) 0 var(--ink); }
  .btn:focus-visible { outline: calc(var(--u) * 1) solid #fff; outline-offset: calc(var(--u) * 1); }

  .countdown {
    position: absolute; left: 0; right: 0; top: 52%;
    text-align: center; z-index: 65; pointer-events: none;
    font-size: calc(var(--u) * 30); font-weight: 900; color: #fff;
    -webkit-text-stroke: calc(var(--u) * 2.4) var(--ink); paint-order: stroke fill;
  }
  .countdown span { display: inline-block; animation: cd .7s ease-out forwards; }
  @keyframes cd { from { transform: scale(1.6); opacity: 0; } 30% { transform: scale(1); opacity: 1; } to { opacity: .0; } }

  @media (prefers-reduced-motion: reduce) {
    .stage.shake, .pill.low b, .hole.wiggle .char, .slot .ico img, .weapon.jitter, .slot.on::after { animation: none; }
    .weapon.jitter.swing { animation: swing .16s ease-out; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="hud">
    <div class="pill"><small data-i18n="score">得分</small><b id="score">0</b></div>
    <div class="pill" id="timePill"><small data-i18n="time">时间</small><b id="time">60</b></div>
    <div class="pill"><small data-i18n="best">最高</small><b id="best">0</b></div>
  </div>
  <button class="slot empty none" id="slot" type="button" data-i18n-label="slot" aria-label="狐萝卜道具">
    <span class="ico"><img src="assets/carrot.png" alt=""></span>
    <span class="count" id="slotCount">0</span>
  </button>

  <img class="face" id="face" alt="">
  <div class="countdown" id="countdown"></div>
  <img class="weapon" id="weapon" src="assets/hammer.png" alt="">

  <div class="overlay" id="overlay">
    <div class="card" id="startCard">
      <h1 data-i18n="title">球球打地鼠</h1>
      <p data-i18n="intro">60 秒内，用锤子敲冒出来的狐球！</p>
      <div class="rules">
        <div class="rule"><span class="ico" style="--cy:.59"><img src="assets/fox.png" alt=""></span><span data-i18n="ruleFox">锤子敲狐球</span><span class="pts">+10</span></div>
        <div class="rule bad"><span class="ico" style="--cy:.69"><img src="assets/leopard-b.png" alt=""></span><span data-i18n="ruleLeopard">不可以打豹球！</span></div>
        <div class="rule feed"><span class="ico" style="--cy:.56"><img src="assets/carrot.png" alt=""></span><span data-i18n="ruleCarrot">神秘的狐萝卜，<br>使用了会发生什么事呢？</span></div>
      </div>
      <button class="btn" id="startBtn" type="button" data-i18n="start">开始</button>
    </div>
    <div class="card" id="resultCard" hidden>
      <h2 data-i18n="timeUp">时间到！</h2>
      <div class="result-score" id="resultScore">0</div>
      <p id="resultNote"></p>
      <button class="btn" id="againBtn" type="button" data-i18n="again">再来一局</button>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh-CN" lang="zh-CN">简</button>
      <button type="button" data-lang="zh-TW" lang="zh-TW">繁</button>
      <button type="button" data-lang="ja" lang="ja">日</button>
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="ko" lang="ko">한</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- 素材 ----
  var A = 'assets/';
  var GIF = {
    foxHit:      { src: A + 'fox-hit.gif',             ms: 1950 },
    foxMiss:     { src: A + 'fox-miss.gif',            ms: 1680 },
    leopardA:    { src: A + 'leopard-a-miss.gif',      ms: 2300 },
    leopardB:    { src: A + 'leopard-b-miss.gif',      ms: 1900 },
    feedFox:     { src: A + 'carrot-feed-fox.gif',     ms: 1350 },
    feedLeopard: { src: A + 'carrot-feed-leopard.gif', ms: 1000 },
    face:        { src: A + 'face.gif',                ms: 1200 }
  };

  // 角色类型：贴图、命中框（471 画布坐标）、没打中动画、被萝卜打到的动画和得分
  //   leopardA = 特殊A：狐球举着豹球    leopardB = 特殊B：普通豹球
  //   leopard：被锤子打中会触发突脸
  var TYPES = {
    fox:      { img: A + 'fox.png',       box: [80, 150, 390, 400], missGif: 'foxMiss',
                feedGif: 'feedFox', feedPts: 20 },
    carrot:   { img: A + 'carrot.png',    box: [135, 105, 335, 400] },
    leopardA: { img: A + 'leopard-a.png', box: [80, 115, 390, 400], leopard: true, missGif: 'leopardA',
                feedGif: 'feedFox', feedPts: 30 },
    leopardB: { img: A + 'leopard-b.png', box: [110, 235, 360, 400], leopard: true, missGif: 'leopardB',
                feedGif: 'feedLeopard', feedPts: 30 }
  };

  var PTS = { hammerFox: 10, hammerLeopard: -20 };

  // 武器：锤头 / 萝卜上的这个点（471 画布坐标）对准指针
  var WEAPONS = {
    hammer: { img: A + 'hammer.png', ax: 235, ay: 140 },
    carrot: { img: A + 'carrot.png', ax: 235, ay: 200 }
  };

  // 洞的位置：取自 洞洞.png，即每个 471x471 地洞画布在 1350x3000 背景上的左上角
  var HOLE_POS = [[317, 1887], [825, 1939], [-27, 2053], [465, 2105], [899, 2241], [259, 2309]];
  var W = 1350, H = 3000, C = 471;

  var GAME_TIME = 60;

  // ---- DOM ----
  var stage = document.getElementById('stage');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var timePill = document.getElementById('timePill');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var startCard = document.getElementById('startCard');
  var resultCard = document.getElementById('resultCard');
  var resultScore = document.getElementById('resultScore');
  var resultNote = document.getElementById('resultNote');
  var langBtns = document.querySelectorAll('#langs [data-lang]');
  var faceEl = document.getElementById('face');
  var weaponEl = document.getElementById('weapon');
  var slotEl = document.getElementById('slot');
  var slotCount = document.getElementById('slotCount');

    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    // 分开写：旧版 Safari 的 connect() 没有返回值，不能连写
    o.connect(g);
    g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfx(kind) {
    if (!ac) return;
    try {
      if (kind === 'bonk') { tone('triangle', 420, 120, 0.14, 0.35); tone('sine', 900, 600, 0.08, 0.15); }
      else if (kind === 'yay') { tone('sine', 660, 660, 0.09, 0.2); tone('sine', 880, 880, 0.09, 0.2, 0.08); tone('sine', 1320, 1320, 0.16, 0.2, 0.16); }
      else if (kind === 'pickup') { tone('sine', 520, 1040, 0.18, 0.22); tone('triangle', 1040, 1560, 0.14, 0.12, 0.1); }
      else if (kind === 'ouch') { tone('sawtooth', 300, 70, 0.45, 0.18); tone('square', 160, 60, 0.4, 0.08); }
      else if (kind === 'whiff') { tone('sine', 260, 180, 0.06, 0.08); }
      else if (kind === 'tick') { tone('sine', 880, 880, 0.08, 0.15); }
      else if (kind === 'go') { tone('sine', 1320, 1320, 0.25, 0.2); }
    } catch (e) {}
  }

  // ---- 流程 ----
  function startGame() {
    initAudio(true);
    overlay.hidden = true;
    holes.forEach(clearHole);
    setWeapon('hammer');
    game.score = 0; game.hits = 0; game.time = GAME_TIME; game.stunned = false; game.carrots = 0;
    updateSlot();
    scoreEl.textContent = 0;
    timeEl.textContent = GAME_TIME;
    timePill.classList.remove('low');

    var n = 3;
    function step() {
      if (n > 0) {
        countdownEl.innerHTML = '<span>' + n + '</span>';
        sfx('tick');
        n--;
        setTimeout(step, 700);
      } else {
        countdownEl.innerHTML = '<span>' + tr('go') + '</span>';
        sfx('go');
        setTimeout(function () { countdownEl.innerHTML = ''; }, 700);
        run();
      }
    }
    step();
  }

  function run() {
    game.playing = true;
    endAt = Date.now() + GAME_TIME * 1000;
    spawnTimer = setTimeout(spawnLoop, 300);
    tickTimer = setInterval(function () {
      var left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      if (left !== game.time) {
        game.time = left;
        timeEl.textContent = left;
        timePill.classList.toggle('low', left <= 10);
        if (left <= 5 && left > 0) sfx('tick');
      }
      if (left <= 0) endGame();
    }, 100);
  }

  function endGame() {
    game.playing = false;
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    setWeapon('hammer');
    timePill.classList.remove('low');
    holes.forEach(function (h) { if (h.state !== 'idle') { h.timers.forEach(clearTimeout); h.timers = []; sink(h); } });

    var record = game.score > game.best;
    if (record) {
      game.best = game.score;
      bestEl.textContent = game.best;
      try { localStorage.setItem('qiuqiu-whack-best', String(game.best)); } catch (e) {}
    }

    setTimeout(function () {
      lastResult = { record: record, best: game.best };
      resultScore.textContent = game.score;
      renderResultNote();
      startCard.hidden = true;
      resultCard.hidden = false;
      overlay.hidden = false;
      // 重新播放卡片弹出动画
      resultCard.style.animation = 'none'; void resultCard.offsetWidth; resultCard.style.animation = '';
      document.getElementById('againBtn').focus();
    }, 500);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);

  // 拦截双击放大（iOS Safari 无视 user-scalable=no）。按钮保留点击；游戏内的点击判定用 pointerdown，不受影响
  document.addEventListener('touchend', function (e) {
    if (!(e.target.closest && e.target.closest('button'))) e.preventDefault();
  }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  // 双指缩放（iOS 专有事件）
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // 离线缓存（https 或 localhost 时启用；用 Capacitor 打包时不启用）
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.Capacitor) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
